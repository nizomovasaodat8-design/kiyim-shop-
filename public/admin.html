<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiyim — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin { max-width: 1100px; margin: 0 auto; padding: 40px 16px; }
    .admin h1 { font-family: var(--serif); font-weight: 400; font-size: 48px; margin-bottom: 24px; }
    .login { display: flex; gap: 10px; max-width: 420px; }
    .login input, .checkout input { flex: 1; }
    .stats { display: flex; gap: 32px; margin: 24px 0; flex-wrap: wrap; }
    .stats b { font-size: 28px; font-weight: 500; display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 400; }
    td small { display: block; color: var(--muted); }
    .wrap { overflow-x: auto; }
  </style>
  <script src="js/brand.js"></script>
</head>
<body>
  <main class="admin">
    <h1>Buyurtmalar</h1>

    <form class="login checkout" id="login">
      <input type="password" id="pass" placeholder="Admin paroli" required>
      <button class="btn btn--red">Kirish</button>
    </form>
    <p class="form-error" id="err"></p>

    <div id="board" hidden>
      <div class="stats" id="stats"></div>
      <div class="wrap">
        <table>
          <thead><tr><th>#</th><th>Sana</th><th>Mijoz</th><th>Mahsulotlar</th><th>Jami</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const money = (n) => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";
    // Matnni xavfsiz chiqarish (mijoz yozgan matnda HTML bo'lsa ham ishlamaydi)
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    async function load(pass) {
      const r = await fetch("/api/orders", { headers: { "x-admin-password": pass } });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error);
      return data;
    }

    function render(orders) {
      const sum = orders.reduce((s, o) => s + o.total, 0);
      const today = orders.filter((o) => o.date.slice(0, 10) === new Date().toISOString().slice(0, 10)).length;
      $("#stats").innerHTML = `
        <div><b>${orders.length}</b><span class="mono">jami buyurtma</span></div>
        <div><b>${today}</b><span class="mono">bugun</span></div>
        <div><b>${money(sum)}</b><span class="mono">umumiy summa</span></div>`;
      $("#rows").innerHTML = orders.length ? orders.map((o) => `
        <tr>
          <td>${o.id}</td>
          <td>${new Date(o.date).toLocaleString("uz-UZ")}</td>
          <td>${esc(o.name)}<small>${esc(o.phone)}</small><small>${esc(o.address)}</small></td>
          <td>${o.items.map((i) => `${esc(i.name)} × ${i.qty}`).join("<br>")}</td>
          <td>${money(o.total)}</td>
        </tr>`).join("") : `<tr><td colspan="5" class="empty">Hozircha buyurtma yo'q</td></tr>`;
    }

    $("#login").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("#err").textContent = "";
      try {
        render(await load($("#pass").value));
        $("#login").hidden = true;
        $("#board").hidden = false;
      } catch (err) {
        $("#err").textContent = err.message;
      }
    });
  </script>
</body>
</html>
